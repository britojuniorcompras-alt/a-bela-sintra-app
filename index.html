<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pedidos - A Bela Sintra</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
        --bg: #271B31;
        --bg-rgb: 39, 27, 49;
        --surface: #393149;
        --surface-2: #443D5C;
        --text: #F5F3F7;
        --text-dim: #A79FBE;
        --line: #4A4260;
        --accent: #F3703A;
        --accent-soft: rgba(243, 112, 58, 0.16);
        --accent-shadow: rgba(243, 112, 58, 0.45);
        --accent-text: #FFFFFF;
        --vinho-logo: var(--accent);
        --radius: 16px;
    }

    body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        color: var(--text);
        background: linear-gradient(180deg, rgba(243,112,58,0.35) 0%, rgba(243,112,58,0.12) 12%, var(--bg) 32%, var(--bg) 100%), var(--bg);
        padding-bottom: 110px;
        -webkit-font-smoothing: antialiased;
        background-image: linear-gradient(180deg, rgba(243,112,58,0.35) 0%, rgba(243,112,58,0.12) 12%, var(--bg) 32%, var(--bg) 100%), repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 7px);
        background-attachment: fixed, scroll;
    }

    header { background: rgba(var(--bg-rgb),0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 18px 20px 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
    .logo-container { display: flex; align-items: center; gap: 10px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.2px; }
    .logo-text { display: flex; flex-direction: column; line-height: 1.25; }
    .logo-subtitulo { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; }
    .hist-btn { background: transparent; color: var(--text-dim); border: 1px solid var(--line); padding: 8px 14px; border-radius: 20px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; }
    .hist-btn:active { border-color: var(--accent); color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .avatar-usuario { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.35); }
    .lista-secao-titulo { color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; padding: 10px 4px 10px 4px; }

    /* Abas de Setores */
    .tabs-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 20px 16px 20px; background: var(--bg); }
    .tabs-bar .tab-btn.tab-btn-larga { grid-column: 1 / -1; }
    /* Sombra de profundidade compartilhada por todos os botões do app */
    .tab-btn, .unit-btn, .bottom-bar button, .btn-confirm, .btn-cancel, .btn-whatsapp-link, .btn-email-link, .btn-copiar, .history-share-btn, .back-btn-inline {
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .tab-btn:active, .unit-btn:active, .bottom-bar button:active, .btn-confirm:active, .btn-cancel:active, .btn-whatsapp-link:active, .btn-email-link:active, .btn-copiar:active, .history-share-btn:active, .back-btn-inline:active {
        box-shadow: 0 1px 4px var(--accent-shadow);
    }
    .tab-btn.active, .unit-btn.active, .bottom-bar button, .btn-confirm {
        box-shadow: 0 8px 20px var(--accent-shadow), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .tab-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 13px 10px; border-radius: 16px; border: none; background: var(--surface); color: var(--text-dim); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; white-space: nowrap; cursor: pointer; transition: 0.2s; width: 100%; box-sizing: border-box; }
    .tab-btn.active { background: var(--accent); color: var(--accent-text); }
    .tab-btn .tab-count { background: var(--surface-2); border-radius: 10px; padding: 1px 7px; font-size: 10.5px; font-family: 'Space Grotesk', sans-serif; }
    .tab-btn.active .tab-count { background: rgba(0,0,0,0.18); color: var(--accent-text); font-weight: 700; }

    .setor-banner { width: calc(100% - 40px); margin: 14px 20px 0 20px; border-radius: 18px; overflow: hidden; position: relative; border: none; background: var(--surface); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
    .setor-banner img { width: 100%; height: auto; display: block; filter: saturate(0.9) brightness(0.85); }
    .setor-banner::after { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, transparent 25%, rgba(9,10,10,0.9) 100%); pointer-events: none; }
    .setor-banner-titulo { position: absolute; left: 14px; bottom: 12px; z-index: 2; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; text-transform: lowercase; letter-spacing: 0.2px; }

    .search-bar { padding: 14px 20px 6px 20px; background: var(--bg); position: sticky; top: 70px; z-index: 98; }
    .search-bar input { width: 100%; padding: 13px 18px; box-sizing: border-box; border: none; border-radius: 24px; background: var(--surface); font-size: 15px; font-family: 'Inter', sans-serif; outline: none; transition: 0.2s; color: var(--text); }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--text-dim); }

    .product-list { padding: 4px 20px 0 20px; display: flex; flex-direction: column; }
    .list-group-header { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); padding: 16px 4px 6px 4px; }
    .edit-obs { width: 100%; min-height: 90px; padding: 14px; font-size: 15px; font-family: 'Inter', sans-serif; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); box-sizing: border-box; margin-bottom: 24px; outline: none; resize: vertical; display: none; }
    .edit-obs:focus { border-color: var(--accent); }
    .edit-obs::placeholder { color: var(--text-dim); }
    .product-item { padding: 15px 12px; border: none; background: var(--surface); margin-bottom: 10px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.15s; border-radius: 18px; box-shadow: 0 6px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04); }
    .product-item:active { background: var(--surface-2); box-shadow: 0 1px 4px var(--accent-shadow); }

    .product-item.selected { position: relative; background: var(--accent-soft); border-radius: 18px; box-shadow: 0 0 0 1.5px var(--accent), 0 6px 16px rgba(0,0,0,0.35); }
    .product-item.selected::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background-color: var(--accent); border-radius: 4px;}

    .product-icon { font-size: 20px; background: var(--surface-2); border: none; border-radius: 50%; width: 42px; height: 42px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .product-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .product-name { font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 600; line-height: 1.3; color: var(--text); letter-spacing: 0.1px; }
    .product-qty { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--accent); font-size: 12px; margin-top: 0; display: none; letter-spacing: 0.3px; line-height: 1.5; }
    .product-qty-obs { font-family: 'Inter', sans-serif; font-weight: 500; color: var(--text-dim); font-size: 11.5px; letter-spacing: 0; }

    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(var(--bg-rgb),0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 20px calc(14px + env(safe-area-inset-bottom)) 20px; border-top: 1px solid var(--line); text-align: center; z-index: 100;}
    .bottom-bar button { background: var(--accent); color: var(--accent-text); border: none; padding: 16px; width: 100%; font-size: 15px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; text-transform: uppercase; letter-spacing: 1px; border-radius: 24px; cursor: pointer; }

    .screen { display: none; padding-bottom: 100px; }
    .screen.active { display: block; animation: fadeIn 0.15s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .screen-header { padding: 18px 20px; display: flex; align-items: center; gap: 14px; background: rgba(var(--bg-rgb),0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100;}
    .back-btn { background: none; border: none; font-size: 24px; color: var(--text); cursor: pointer; padding: 0 8px 0 0; font-weight: 300;}
    .screen-header h2 { margin:0; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.2px;}

    .edit-container { padding: 26px 20px; text-align: center; max-width: 480px; margin: 0 auto; }
    .edit-titulo-destaque { margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .edit-titulo-destaque span:first-child { font-size: 44px; background: var(--surface); padding: 18px; border-radius: 16px; border: 1px solid var(--line); }
    .edit-titulo-destaque span:last-child { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; color: var(--text); line-height: 1.3; margin-top: 6px;}

    .edit-input { width: 100%; padding: 12px 0; font-size: 46px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; text-align: center; border: none; border-bottom: 2px solid var(--accent); background: transparent; color: var(--text); box-sizing: border-box; margin-bottom: 30px; outline: none;}
    .edit-input::placeholder { color: var(--line); }

    .text-input { width: 100%; padding: 14px 16px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 15px; font-family: 'Inter', sans-serif; color: var(--text); outline: none; margin-bottom: 14px; }
    .text-input:focus { border-color: var(--accent); }
    .text-input::placeholder { color: var(--text-dim); }

    .calendar-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 6px 20px; }
    .calendar-nav-btn { background: var(--surface); border: 1px solid var(--line); color: var(--text); width: 38px; height: 38px; border-radius: 10px; font-size: 18px; cursor: pointer; }
    .calendar-month-label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--text); text-transform: capitalize; }
    .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); padding: 10px 20px 0 20px; }
    .calendar-weekdays span { text-align: center; font-size: 11px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 8px 20px 30px 20px; }
    .calendar-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; background: var(--surface); cursor: pointer; border: 1px solid transparent; }
    .calendar-day.empty { visibility: hidden; cursor: default; }
    .calendar-day .cal-day-num { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: var(--text); }
    .calendar-day.today { border-color: var(--accent); }
    .calendar-day.today .cal-day-num { color: var(--accent); font-weight: 700; }
    .calendar-day .cal-day-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-top: 4px; }

    .units { display: flex; gap: 8px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
    .unit-btn { padding: 10px 18px; border: 1px solid var(--line); background: var(--surface); color: var(--text-dim); border-radius: 20px; font-weight: 700; font-size: 12.5px; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer; transition: 0.2s; }
    .unit-btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

    .edit-actions { display: flex; gap: 12px; }
    .btn-cancel { background: transparent; color: var(--text-dim); border: 1px solid var(--line); flex: 1; padding: 16px; border-radius: 22px; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
    .btn-confirm { background: var(--accent); color: var(--accent-text); flex: 2; padding: 16px; border: none; border-radius: 22px; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }

    .summary-list, .history-list { padding: 8px 20px; }
    .summary-item { display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px;}
    .summary-item-icon { font-size: 18px; margin-right: 14px; background: var(--surface); padding: 9px; border-radius: 12px; border: 1px solid var(--line); }
    .summary-item-info { flex: 1; display: flex; justify-content: space-between; align-items: center; font-family: 'Inter', sans-serif; }
    .summary-item-info span { font-weight: 500; color: var(--text); }
    .summary-item-info strong { font-weight: 700; color: var(--accent); font-size: 16px; font-family: 'Space Grotesk', sans-serif;}

    .summary-footer { padding: 24px 20px 40px 20px; text-align: center; background: transparent; display: flex; flex-direction: column; gap: 12px; }
    .btn-whatsapp-link { display: block; box-sizing: border-box; text-decoration: none; background: #25D366; color: white; border: none; padding: 16px; width: 100%; font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px; border-radius: 24px; cursor: pointer; text-align: center; }
    .btn-copiar { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 16px; width: 100%; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px; border-radius: 24px; cursor: pointer; }
    .btn-email-link { display: block; box-sizing: border-box; text-decoration: none; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); padding: 16px; width: 100%; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px; border-radius: 24px; cursor: pointer; text-align: center; }

    .history-card-actions { display: flex; gap: 8px; margin-top: 14px; }
    .history-share-btn { flex: 1; text-decoration: none; text-align: center; background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--line); padding: 10px 6px; border-radius: 16px; font-size: 11px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; }
    .history-share-btn.whats { color: #25D366; border-color: rgba(37,211,102,0.35); }
    .history-share-btn.del { color: #E85D5D; border-color: rgba(232,93,93,0.35); }

    .prio-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .prio-dot.prio-vermelho { background: #E85D5D; }
    .prio-dot.prio-amarelo { background: #F2C94C; }
    .prio-dot.prio-verde { background: #4CAF50; }

    .prio-icon-vermelho { background: rgba(232,93,93,0.15) !important; }
    .prio-icon-amarelo { background: rgba(242,201,76,0.15) !important; }
    .prio-icon-verde { background: rgba(76,175,80,0.15) !important; }

    .prio-btn-vermelho.active { background: #E85D5D; color: #10120F; border-color: #E85D5D; }
    .prio-btn-amarelo.active { background: #F2C94C; color: #10120F; border-color: #F2C94C; }
    .prio-btn-verde.active { background: #4CAF50; color: #10120F; border-color: #4CAF50; }

    .problema-item { position: relative; }
    .problema-del-btn { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 0 4px; flex-shrink: 0; }
    .problema-sanar-btn { background: rgba(76,175,80,0.12); border: 1px solid rgba(76,175,80,0.4); color: #4CAF50; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; flex-shrink: 0; }

    .history-card { background: var(--surface); padding: 20px; border-radius: 18px; border: 1px solid var(--line); margin-bottom: 16px; }
    .history-date { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--text); margin-bottom: 4px; font-size: 15px; }
    .history-setor { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .history-item { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-dim); padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between;}
    .history-item:last-child { border-bottom: none; }
    .history-item strong { color: var(--text); }

    .folder-item .folder-chevron { margin-left: auto; color: var(--text-dim); font-size: 20px; flex-shrink: 0; }
    .folder-item .product-qty { display: block !important; }

    .grupo-nav-header { display: flex; align-items: center; gap: 10px; padding: 14px 20px 6px 20px; background: var(--bg); }
    .grupo-nav-header .back-btn-inline { background: var(--surface); border: 1px solid var(--line); color: var(--text); font-size: 18px; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; flex-shrink: 0; }
    .grupo-nav-header span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--text); }
</style>
</head>
<body>

<div id="main-screen" class="screen active">
    <header>
        <div class="logo-container">
            <svg width="35" height="35" viewBox="0 0 100 100">
                <g fill="var(--vinho-logo)">
                    <polygon points="50,42 55,50 50,58 45,50" />
                    <g>
                       <polygon points="50,28 56,38 44,38" />
                       <polygon points="50,28 56,38 44,38" transform="rotate(45 50 50)" />
                       <polygon points="50,28 56,38 44,38" transform="rotate(90 50 50)" />
                       <polygon points="50,28 56,38 44,38" transform="rotate(135 50 50)" />
                       <polygon points="50,28 56,38 44,38" transform="rotate(180 50 50)" />
                       <polygon points="50,28 56,38 44,38" transform="rotate(225 50 50)" />
                       <polygon points="50,28 56,38 44,38" transform="rotate(270 50 50)" />
                       <polygon points="50,28 56,38 44,38" transform="rotate(315 50 50)" />
                    </g>
                    <g>
                       <polygon points="50,15 62,32 38,32" />
                       <polygon points="50,15 62,32 38,32" transform="rotate(45 50 50)" />
                       <polygon points="50,15 62,32 38,32" transform="rotate(90 50 50)" />
                       <polygon points="50,15 62,32 38,32" transform="rotate(135 50 50)" />
                       <polygon points="50,15 62,32 38,32" transform="rotate(180 50 50)" />
                       <polygon points="50,15 62,32 38,32" transform="rotate(225 50 50)" />
                       <polygon points="50,15 62,32 38,32" transform="rotate(270 50 50)" />
                       <polygon points="50,15 62,32 38,32" transform="rotate(315 50 50)" />
                    </g>
                    <g>
                       <polygon points="50,0 58,12 42,12" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(30 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(60 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(90 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(120 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(150 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(180 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(210 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(240 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(270 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(300 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(330 50 50)" />
                    </g>
                </g>
            </svg>
            <div class="logo-text">
                <div class="logo-subtitulo">Gestão de Compras</div>
                <div>A Bela Sintra</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="hist-btn" id="btnAgendaTopo" onclick="abrirAgendaDireto()">📅 Agenda</button>
            <button class="hist-btn" id="btnCotacaoTopo" onclick="abrirCotacaoDireto()">💰 Cotação</button>
            <button class="hist-btn" onclick="abrirHistorico()">📋 Histórico</button>
            <div class="avatar-usuario">AS</div>
        </div>
    </header>

    <div class="tabs-bar" id="tabsBar"></div>
    
    <div class="setor-banner" id="setorBanner" style="display:none;">
        <img id="setorBannerImg" src="" alt="">
        <div class="setor-banner-titulo" id="setorBannerTitulo"></div>
    </div>

    <div class="grupo-nav-header" id="grupoNavHeader" style="display:none;">
        <button class="back-btn-inline" onclick="voltarParaFolders()">←</button>
        <span id="grupoNavTitulo"></span>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar ingrediente..." onkeyup="filtrarLista()">
    </div>

    <div class="product-list" id="productList"></div>

    <div class="bottom-bar" id="mainBottomBar">
        <button onclick="acaoBotaoPrincipal()"><span id="bottomBarLabel">Ver Pedido</span> (<span id="cartCount">0</span>)</button>
    </div>
</div>

<div id="edit-screen" class="screen">
    <div class="screen-header">
        <button class="back-btn" onclick="fecharEdicao(false)">←</button>

// SUPABASE — banco compartilhado entre todos os aparelhos
// ============================================================
var SUPABASE_URL = "https://kfgcqshhltemsochafid.supabase.co";
var SUPABASE_KEY = "sb_publishable_-t8ynneFzBs_Xw3oEWenzA_APQqzOa-";
var supabaseOnline = true; // vira false se alguma chamada falhar, pra avisar o usuário

function supabaseHeaders(extra) {
    var h = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
    };
    if (extra) { for (var k in extra) { h[k] = extra[k]; } }
    return h;
}

function supabaseGet(tabela, query, callback) {
    var url = SUPABASE_URL + "/rest/v1/" + tabela + (query ? ("?" + query) : "");
    fetch(url, { headers: supabaseHeaders() })
        .then(function(r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
        .then(function(data) { supabaseOnline = true; callback(null, data); })
        .catch(function(err) { supabaseOnline = false; callback(err, null); });
}

function supabasePost(tabela, registro, callback) {
    fetch(SUPABASE_URL + "/rest/v1/" + tabela, {
        method: "POST",
        headers: supabaseHeaders({ "Prefer": "return=representation" }),
        body: JSON.stringify(registro)
    }).then(function(r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
      .then(function(data) { supabaseOnline = true; if (callback) callback(null, data); })
      .catch(function(err) { supabaseOnline = false; if (callback) callback(err, null); });
}

function supabaseDelete(tabela, filtroQuery, callback) {
    fetch(SUPABASE_URL + "/rest/v1/" + tabela + "?" + filtroQuery, {
        method: "DELETE",
        headers: supabaseHeaders()
    }).then(function(r) { if (!r.ok) throw new Error("status " + r.status); supabaseOnline = true; if (callback) callback(null); })
      .catch(function(err) { supabaseOnline = false; if (callback) callback(err); });
}

function gerarIdUnico() {
    return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
}

function lerHistoricoSeguro() {
    try {
        var dados = localStorage.getItem('pedidosHistoricoABS');
        if (dados) return JSON.parse(dados);
        return [];
    } catch (erro) { return []; }
}

function salvarHistoricoSeguro(historicoArray) {
    try { localStorage.setItem('pedidosHistoricoABS', JSON.stringify(historicoArray)); } catch (erro) { }
}

function registrarNoHistoricoCompartilhado(entry) {
    // Salva local (funciona offline) e envia pro Supabase (aparece nos outros celulares)
    var historicoLocal = lerHistoricoSeguro();
    historicoLocal.unshift(entry);
    salvarHistoricoSeguro(historicoLocal);

    supabasePost('historico', {
        data_texto: entry.data,
        setor: entry.setor,
        tipo: entry.tipo,
        itens: entry.itens
    }, function(err) {
        if (err) { console.warn('Não foi possível sincronizar com o Supabase (salvo localmente):', err); }
    });
}

function itemEstaCompleto(setorObj, registro) {
    if (!registro) return false;
    if (setorObj && setorObj.tipo === 'checklist') return !!registro.confirmado;
    return registro.qtd > 0;
}

function contarItensSetor(setorId) {
    if (setorId === 'manutencao') { return problemasAtuais.length; }
    var setorObj = getSetorPorId(setorId);

    var n = 0;
    for (var k in pedido) { if (itemEstaCompleto(setorObj, pedido[k])) n++; }
    return n;
}

    var btnCotacaoTopo = document.getElementById('btnCotacaoTopo');

        if (setor.id === 'agenda' || setor.id === 'cotacao') { continue; } // Agenda e Cotação têm acesso fixo no cabeçalho, não ficam na grade de abas
        var btn = document.createElement('button');
        var ehLarga = (setor.id === 'fornecedores' || setor.id === 'manutencao');
        var ehAtiva = (setor.id === setorAtivoId);
        btn.className = 'tab-btn' + (ehLarga ? ' tab-btn-larga' : '') + (ehAtiva ? ' active' : '');
        btn.onclick = (function(id) { return function() { trocarSetor(id); }; })(setor.id);
        if (!ehAtiva && setor.accent) {
            btn.style.background = 'linear-gradient(135deg,' + escurecerCor(setor.accent, 0.55) + ',var(--surface))';

        for (var i = 0; i < dados.length; i++) {
            listaConvertida.push({
                id: dados[i].id,
                areaId: dados[i].area_id,
                areaNome: dados[i].area_nome,
                areaIcone: dados[i].area_icone,
                descricao: dados[i].descricao,
                prioridade: dados[i].prioridade
            });
        }
        problemasAtuais = listaConvertida;
        salvarProblemasManutencaoSeguro(problemasAtuais);

function aplicarAccentSetor() {
    var setor = getSetorAtivo();
    if (setor.accent) {
        document.documentElement.style.setProperty('--accent', setor.accent);
        var r = parseInt(setor.accent.substr(1,2), 16);
        var g = parseInt(setor.accent.substr(3,2), 16);
        var b = parseInt(setor.accent.substr(5,2), 16);
        document.documentElement.style.setProperty('--accent-soft', 'rgba(' + r + ',' + g + ',' + b + ',0.14)');
        document.documentElement.style.setProperty('--accent-shadow', 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
        // Luminância aproximada: decide se o texto sobre a cor do setor deve ser claro ou escuro
        var luminancia = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        document.documentElement.style.setProperty('--accent-text', luminancia > 0.55 ? '#15161A' : '#FFFFFF');
    }
}

function escurecerCor(corHex, fator) {
    var r = parseInt(corHex.substr(1,2), 16);
    var g = parseInt(corHex.substr(3,2), 16);
    var b = parseInt(corHex.substr(5,2), 16);
    r = Math.round(r * fator);
    g = Math.round(g * fator);
    b = Math.round(b * fator);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function gruposUnicosDoSetor(setor) {
    var vistos = {};
    var lista = [];
    for (var i = 0; i < setor.produtos.length; i++) {
        var g = setor.produtos[i].grupo;
        if (g && !vistos[g]) {
            vistos[g] = true;
            lista.push({ nome: g, icone: setor.produtos[i].icone });
        }
    }
    return lista;
}

function atualizarVisuaisDaLista() {
    var setor = getSetorAtivo();

    if (setor.tipo === 'manutencao') {
        document.getElementById('cartCount').innerText = problemasAtuais.length;
        montarAbas();
        return;
    }

    var pedidoAtual = pedidos[setor.id];
    var filtro = document.getElementById('searchInput').value.toLowerCase();
    var contador = 0;
    var visivelPorIndice = {};

    // ---- Modo pasta (lista de fornecedores): atualiza só as contagens de cada pasta ----
    if (setor.navegacaoPorGrupo && grupoNavAtivo === null) {
        var grupos = gruposUnicosDoSetor(setor);
        var contagemPorGrupo = {};
        for (var gi = 0; gi < grupos.length; gi++) { contagemPorGrupo[grupos[gi].nome] = 0; }

        for (var k = 0; k < setor.produtos.length; k++) {
            var pk = setor.produtos[k];
            var registroK = pedidoAtual[pk.nome];
            if (itemEstaCompleto(setor, registroK)) {
                contador++;
                if (pk.grupo) { contagemPorGrupo[pk.grupo] = (contagemPorGrupo[pk.grupo] || 0) + 1; }
            }
        }

        for (var gj = 0; gj < grupos.length; gj++) {
            var badge = document.getElementById('folder-qtd-' + gj);
            var n = contagemPorGrupo[grupos[gj].nome] || 0;
            if (badge) {
                if (n > 0) {
                    badge.innerText = n + (n === 1 ? ' item lançado' : ' itens lançados');
                    badge.style.display = 'block';
                } else {
                    badge.innerText = '';
                    badge.style.display = 'none';
                }
            }
        }

        document.getElementById('cartCount').innerText = contador;
        montarAbas();
        return;
    }
    
    for (var i = 0; i < setor.produtos.length; i++) {
        var p = setor.produtos[i];
        var item = document.getElementById('prod-item-' + i);
        var divQtd = document.getElementById('prod-qtd-' + i);

        var registro = pedidoAtual[p.nome];
        var estaSelecionado = itemEstaCompleto(setor, registro);

        // Item pode não estar renderizado na tela atual (ex: outra pasta de fornecedor) — conta pro total mesmo assim
        if (!item || !divQtd) {
            if (estaSelecionado) { contador++; }
            continue;
        }

        var visivel = p.nome.toLowerCase().indexOf(filtro) !== -1;
        
        if (visivel) {
            item.style.display = "flex";
        } else {
            item.style.display = "none";
        }
        visivelPorIndice[i] = visivel;
        
        if (estaSelecionado) {
            item.className = 'product-item selected';
            if (setor.tipo === 'checklist') {
                var textoMarcado = (setor.id === 'cotacao') ? '✓ Na lista de cotação' : '✓ Pedido feito';
                divQtd.innerHTML = textoMarcado + (registro.obs ? '<br><span class="product-qty-obs">' + registro.obs.replace(/</g,'&lt;') + '</span>' : '');
            } else {
                divQtd.innerText = registro.qtd + ' ' + registro.unidade + (registro.maturacao ? ' · ' + registro.maturacao : '');
            }
            divQtd.style.display = "block";
            contador++;
        } else {
            item.className = 'product-item';
            divQtd.style.display = "none";
        }
    }

    // Esconde cabeçalhos de grupo sem nenhum item visível na busca atual
    for (var g = 0; g < gruposAtuais.length; g++) {
        var grupo = gruposAtuais[g];
        var algumVisivel = false;
        for (var j = 0; j < grupo.indices.length; j++) {
            if (visivelPorIndice[grupo.indices[j]]) { algumVisivel = true; break; }
        }
        grupo.headerEl.style.display = algumVisivel ? "block" : "none";
    }

    document.getElementById('cartCount').innerText = contador;
    montarAbas();
}

function trocarTela(idTela) {
    if (idTela !== 'main-screen' && document.getElementById('main-screen').classList.contains('active')) {
        scrollSalvo = window.pageYOffset || document.documentElement.scrollTop;
    }

    var telas = document.querySelectorAll('.screen');
    for(var i = 0; i < telas.length; i++) { telas[i].classList.remove('active'); }
    
    var telaNova = document.getElementById(idTela);
    telaNova.classList.add('active');
    
    if (idTela === 'main-screen') {
        window.scrollTo(0, scrollSalvo);
        document.documentElement.scrollTop = scrollSalvo;
        document.body.scrollTop = scrollSalvo;
    } else {
        window.scrollTo(0, 0); 
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        
        var cabecalho = telaNova.querySelector('.screen-header');
        if(cabecalho) {
            setTimeout(function() {
                cabecalho.scrollIntoView({ behavior: 'instant', block: 'start' });
            }, 10);
        }
    }
}

        input.style.display = "none";

        maturacaoContainer.style.display = "none";

function confirmarQuantidade() {
    var setor = getSetorAtivo();

    if (setor.tipo === 'checklist') {
        var obs = document.getElementById('editObs').value;
        pedidos[setor.id][produtoSendoEditado] = { confirmado: true, obs: obs };
    } else {
        var inputVal = document.getElementById('editQty').value.replace(',', '.');
        var val = parseFloat(inputVal);
        
        if (val > 0) { 
            var registroNovo = { qtd: val, unidade: unidadeSelecionada };
            if (setor.maturacao && setor.maturacao.length > 0) { registroNovo.maturacao = maturacaoSelecionada; }

function linkWhatsApp(texto) {
    return "https://wa.me/?text=" + encodeURIComponent(texto);
}

function linkEmail(assunto, texto) {
    return "mailto:?subject=" + encodeURIComponent(assunto) + "&body=" + encodeURIComponent(texto);
}

function copiarTextoGenerico(texto, mensagemSucesso) {
    var areaTexto = document.createElement("textarea");
    areaTexto.value = texto;
    areaTexto.style.position = "fixed";
    areaTexto.style.top = "0";
    areaTexto.style.left = "0";
    document.body.appendChild(areaTexto);
    areaTexto.focus();
    areaTexto.select();

    var copiado = false;
    try { copiado = document.execCommand('copy'); } catch (err) { copiado = false; }
    document.body.removeChild(areaTexto);

    if (copiado) {
        alert(mensagemSucesso || "✅ Texto copiado!");
    } else {
        alert("Erro. Seu navegador bloqueou a cópia automática.");
    }
    return copiado;
}

function copiarItemHistorico(indice) {
    var entry = historicoCache[indice];
    if (!entry) return;
    copiarTextoGenerico(textoDoHistorico(entry), "✅ Pedido copiado!");

function textoDoHistorico(entry) {

}

function gerarTextoPedido() {
    var setor = getSetorAtivo();
    var pedidoAtual = pedidos[setor.id];
    var dataLocal = new Date();
    var dataStr = dataLocal.toLocaleDateString('pt-BR');
    var horaStr = dataLocal.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

    var grupoFiltro = (setor.navegacaoPorGrupo && grupoNavAtivo) ? grupoNavAtivo : null;
    var mapaGrupoPorNome = {};
    if (grupoFiltro) {
        for (var m = 0; m < setor.produtos.length; m++) { mapaGrupoPorNome[setor.produtos[m].nome] = setor.produtos[m].grupo; }
    }

    var titulo = grupoFiltro ? ((setor.tipo === 'checklist' ? "Cotação" : "Pedido") + " " + grupoFiltro) : (setor.tipo === 'checklist' ? "Fornecedores confirmados" : ("Pedido " + setor.nome));
    var texto = "*" + titulo + " - " + dataStr + " às " + horaStr + "*\n" + dadosFiscaisTexto() + "\n\n";
    var itensParaHistorico = [];
    var temItens = false;
    
    for (var k in pedidoAtual) {
        if (grupoFiltro && mapaGrupoPorNome[k] !== grupoFiltro) { continue; }
        var registro = pedidoAtual[k];
        if (itemEstaCompleto(setor, registro)) {
            temItens = true;
            var linha;
            if (setor.tipo === 'checklist') {
                linha = "- " + k + (registro.obs ? "\n  " + registro.obs : "");
            } else {
                linha = "- " + registro.qtd + " " + registro.unidade + (registro.maturacao ? " (" + registro.maturacao + ")" : "") + " - " + k;
            }
            texto += linha + "\n";
            itensParaHistorico.push(linha);
        }
    }
    
    return { texto: texto, itens: itensParaHistorico, temItens: temItens, dataStr: dataStr, horaStr: horaStr, setorNome: setor.nome, setorId: setor.id, tipo: setor.tipo, grupoFiltro: grupoFiltro };
}

    });
    
    setTimeout(function() {
        if (dados.grupoFiltro) {
            var setorObj = getSetorPorId(dados.setorId);

            for (var m = 0; m < setorObj.produtos.length; m++) { mapaGrupoPorNome[setorObj.produtos[m].nome] = setorObj.produtos[m].grupo; }
            var pedidoDoSetor = pedidos[dados.setorId];
            for (var k in pedidoDoSetor) {
                if (mapaGrupoPorNome[k] === dados.grupoFiltro) { delete pedidoDoSetor[k]; }

            pedidos[dados.setorId] = {};
        }

        trocarTela('main-screen');

// ---- MANUTENÇÃO: renderização e lógica ----

function areaPorId(id) {
    for (var i = 0; i < areasManutencao.length; i++) { if (areasManutencao[i].id === id) return areasManutencao[i]; }
    return null;
}

function contarProblemasArea(areaId) {
    var n = 0;
    for (var i = 0; i < problemasAtuais.length; i++) { if (problemasAtuais[i].areaId === areaId) n++; }
    return n;
}

function prioridadesPresentesArea(areaId) {
    var presentes = {};
    for (var i = 0; i < problemasAtuais.length; i++) {
        if (problemasAtuais[i].areaId === areaId) { presentes[problemasAtuais[i].prioridade] = true; }
    }
    return presentes;
}

function montarListaManutencao() {
    var lista = document.getElementById('productList');
    lista.innerHTML = "";

    for (var i = 0; i < areasManutencao.length; i++) {
        var area = areasManutencao[i];

        var item = document.createElement('div');
        item.className = 'product-item';
        item.onclick = (function(areaId) { return function() { abrirAreaManutencao(areaId); }; })(area.id);

        var icone = document.createElement('div');
        icone.className = 'product-icon';
        icone.innerText = area.icone;

        var info = document.createElement('div');
        info.className = 'product-info';

        var nome = document.createElement('div');
        nome.className = 'product-name';
        nome.innerText = area.nome;
        info.appendChild(nome);

        var n = contarProblemasArea(area.id);
        var statusDiv = document.createElement('div');
        statusDiv.className = 'product-qty';
        if (n > 0) {
            var presentes = prioridadesPresentesArea(area.id);
            var dots = '';
            for (var o = 0; o < ordemPrioridades.length; o++) {
                var chave = ordemPrioridades[o];
                if (presentes[chave]) { dots += '<span class="prio-dot prio-' + chave + '"></span>'; }
            }
            statusDiv.innerHTML = dots + n + (n === 1 ? ' problema' : ' problemas');
            statusDiv.style.display = "block";
            item.className = 'product-item selected';
        }
        info.appendChild(statusDiv);

        item.appendChild(icone);
        item.appendChild(info);
        lista.appendChild(item);
    }
}

function abrirAreaManutencao(areaId) {
    areaManutencaoAtiva = areaId;
    var area = areaPorId(areaId);
    document.getElementById('manutencaoAreaTitulo').innerText = area.nome;
    montarListaProblemasArea();

function montarListaProblemasArea() {
    var lista = document.getElementById('manutencaoProblemasList');
    lista.innerHTML = "";
    var problemas = [];
    for (var i = 0; i < problemasAtuais.length; i++) {
        if (problemasAtuais[i].areaId === areaManutencaoAtiva) { problemas.push(problemasAtuais[i]); }
    }

        lista.innerHTML = "<p style='text-align:center; color:var(--text-dim); margin-top: 30px; font-family: Inter, sans-serif; font-size: 14px;'>Nenhum problema registrado nesta área ainda.</p>";
        return;
    }

    for (var j = 0; j < problemas.length; j++) {
        var p = problemas[j];
        var item = document.createElement('div');
        item.className = 'product-item problema-item selected';

        var dot = document.createElement('div');
        dot.className = 'product-icon prio-icon-' + p.prioridade;

        desc.innerText = p.descricao;

        acoesProblema.appendChild(sanarBtn);

        var delBtn = document.createElement('button');
        delBtn.innerText = '✕';

function removerProblema(id) {
    var novaLista = [];
    for (var i = 0; i < problemasAtuais.length; i++) { if (problemasAtuais[i].id !== id) { novaLista.push(problemasAtuais[i]); } }
    problemasAtuais = novaLista;
    salvarProblemasManutencaoSeguro(problemasAtuais);
    supabaseDelete('manutencao_problemas', 'id=eq.' + encodeURIComponent(id), function(err) {
        if (err) { console.warn('Não foi possível remover no Supabase (removido localmente):', err); }
    });
    montarListaProblemasArea();
    atualizarVisuaisDaLista();
}

function marcarProblemaSanado(id) {
    var idx = -1;
    for (var i = 0; i < problemasAtuais.length; i++) { if (problemasAtuais[i].id === id) { idx = i; break; } }
    if (idx === -1) return;

    var problema = problemasAtuais[idx];
    problemasAtuais.splice(idx, 1);
    salvarProblemasManutencaoSeguro(problemasAtuais);
    supabaseDelete('manutencao_problemas', 'id=eq.' + encodeURIComponent(id), function(err) {
        if (err) { console.warn('Não foi possível remover no Supabase (removido localmente):', err); }
    });

    var dataLocal = new Date();
    var dataStr = dataLocal.toLocaleDateString('pt-BR');
    var horaStr = dataLocal.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
    var linha = "✅ SANADO — " + prioridadesInfo[problema.prioridade].emoji + " " + problema.areaNome + ": " + problema.descricao;

    registrarNoHistoricoCompartilhado({
        data: dataStr + " às " + horaStr,
        setor: "Manutenção",
        tipo: "manutencao",
        itens: [linha]
    });

    montarListaProblemasArea();
    atualizarVisuaisDaLista();
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function agendaChaveData(ano, mes, dia) {
    return ano + '-' + pad2(mes + 1) + '-' + pad2(dia);
}

function lerAgendaSegura() {
    try {
        var dados = localStorage.getItem('agendaCompromissosABS');
        if (dados) return JSON.parse(dados);
        return {};
    } catch (erro) { return {}; }
}

function salvarAgendaSegura(cache) {
    try { localStorage.setItem('agendaCompromissosABS', JSON.stringify(cache)); } catch (erro) { }
}

function sincronizarAgendaSupabase() {
    supabaseGet('agenda', 'select=*&order=data.asc', function(err, dados) {
        if (err || !dados) { return; } // mantém o que já está localmente se der erro
        var novoCache = {};
        for (var i = 0; i < dados.length; i++) {
            var d = dados[i];
            var chave = d.data;
            if (!novoCache[chave]) { novoCache[chave] = []; }
            novoCache[chave].push({ id: d.id, titulo: d.titulo, horario: d.horario, observacao: d.observacao });
        }
        compromissosCache = novoCache;
        salvarAgendaSegura(compromissosCache);

        if (setorAtivoId === 'agenda') {
            montarCalendario();
            if (agendaDataSelecionada) { renderizarListaDiaAgenda(); }
        }
    });
}

function montarCalendario() {
    var lista = document.getElementById('productList');
    lista.innerHTML = "";

    var header = document.createElement('div');
    header.className = 'calendar-header';

    var btnPrev = document.createElement('button');
    btnPrev.className = 'calendar-nav-btn';
    btnPrev.innerText = '‹';
    btnPrev.onclick = function() { mudarMesAgenda(-1); };

    var label = document.createElement('div');
    label.className = 'calendar-month-label';
    label.innerText = NOMES_MESES[agendaMes] + ' de ' + agendaAno;

    var btnNext = document.createElement('button');
    btnNext.className = 'calendar-nav-btn';
    btnNext.innerText = '›';
    btnNext.onclick = function() { mudarMesAgenda(1); };

    header.appendChild(btnPrev);
    header.appendChild(label);
    header.appendChild(btnNext);
    lista.appendChild(header);

    var weekdays = document.createElement('div');
    weekdays.className = 'calendar-weekdays';
    for (var w = 0; w < 7; w++) {
        var sp = document.createElement('span');
        sp.innerText = NOMES_DIAS_SEMANA[w];
        weekdays.appendChild(sp);
    }
    lista.appendChild(weekdays);

    var grid = document.createElement('div');
    grid.className = 'calendar-grid';

    var primeiroDiaSemana = new Date(agendaAno, agendaMes, 1).getDay();
    var totalDias = new Date(agendaAno, agendaMes + 1, 0).getDate();

    var hoje = new Date();
    var hojeChave = agendaChaveData(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());

    for (var e = 0; e < primeiroDiaSemana; e++) {
        var vazio = document.createElement('div');
        vazio.className = 'calendar-day empty';
        grid.appendChild(vazio);
    }

    for (var d = 1; d <= totalDias; d++) {
        var chave = agendaChaveData(agendaAno, agendaMes, d);
        var cel = document.createElement('div');
        cel.className = 'calendar-day' + (chave === hojeChave ? ' today' : '');
        cel.onclick = (function(k) { return function() { abrirDiaAgenda(k); }; })(chave);

        var num = document.createElement('div');
        num.className = 'cal-day-num';
        num.innerText = d;
        cel.appendChild(num);

        if (compromissosCache[chave] && compromissosCache[chave].length > 0) {
            var dot = document.createElement('div');
            dot.className = 'cal-day-dot';
            cel.appendChild(dot);
        }

        grid.appendChild(cel);
    }

    lista.appendChild(grid);
}

function mudarMesAgenda(delta) {
    agendaMes += delta;
    if (agendaMes < 0) { agendaMes = 11; agendaAno--; }
    else if (agendaMes > 11) { agendaMes = 0; agendaAno++; }
    montarCalendario();
}

    supabasePost('agenda', { data: agendaDataSelecionada, titulo: titulo, horario: horario, observacao: observacao }, function(err, dados) {

    var confirmou = confirm('Excluir este compromisso?');

    var itens = compromissosCache[agendaDataSelecionada] || [];
    var novaLista = [];
    for (var i = 0; i < itens.length; i++) { if (itens[i].id !== id) { novaLista.push(itens[i]); } }
    compromissosCache[agendaDataSelecionada] = novaLista;

    supabaseDelete('agenda', 'id=eq.' + encodeURIComponent(id), function(err) {

    montarCalendario();

function excluirItemHistorico(indice) {
    var entry = historicoCache[indice];
    if (!entry) { return; }

    var confirmou = confirm("Excluir este registro do histórico? Essa ação não pode ser desfeita.");
    if (!confirmou) { return; }

    // Remove localmente e re-renderiza na hora, sem esperar a rede
    historicoCache.splice(indice, 1);
    salvarHistoricoSeguro(historicoCache);
    renderizarListaHistorico(historicoCache);

    // Remove também do banco compartilhado, se esse registro já tiver sido sincronizado (tem id)
    if (entry.id) {
        supabaseDelete('historico', 'id=eq.' + entry.id, function(err) {
            if (err) { console.warn('Não foi possível excluir do Supabase (pode reaparecer ao sincronizar):', err); }
        });
    }
}

// ---- Som de clique: gerado na hora (sem arquivo), toca ao tocar em qualquer botão/item ----
var audioCtxClique = null;

function tocarSomClique() {
    try {
        if (!audioCtxClique) {
            audioCtxClique = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtxClique.state === 'suspended') { audioCtxClique.resume(); }

        var osc = audioCtxClique.createOscillator();
        var ganho = audioCtxClique.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1000, audioCtxClique.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtxClique.currentTime + 0.045);
        ganho.gain.setValueAtTime(0.13, audioCtxClique.currentTime);
        ganho.gain.exponentialRampToValueAtTime(0.001, audioCtxClique.currentTime + 0.05);

        osc.connect(ganho);
        ganho.connect(audioCtxClique.destination);
        osc.start();
        osc.stop(audioCtxClique.currentTime + 0.05);
    } catch (erro) { /* dispositivos sem suporte a áudio simplesmente ficam em silêncio */ }
}

document.addEventListener('click', function(evento) {
    var alvo = evento.target.closest('button, .tab-btn, .product-item, .unit-btn, .btn-whatsapp-link, .btn-email-link, .back-btn, .back-btn-inline, .history-share-btn, .folder-item');
    if (alvo) {
        tocarSomClique();
        if (navigator.vibrate) { navigator.vibrate(35); } // só funciona em Android; iPhone ignora silenciosamente
    }
}, true);

document.addEventListener('DOMContentLoaded', iniciar);
if (document.readyState === "interactive" || document.readyState === "complete") { iniciar(); }
</script>
