<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pedidos - A Bela Sintra</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; }

    :root {
        --bg: #121412;
        --surface: #1B1E1A;
        --surface-2: #242821;
        --text: #EDEDE6;
        --text-dim: #8B8F86;
        --line: #33362F;
        --accent: #8FD14F;
        --accent-soft: rgba(143, 209, 79, 0.14);
        --vinho-logo: var(--accent);
        --radius: 14px;
    }

    body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        color: var(--text);
        background: var(--bg);
        padding-bottom: 110px;
        -webkit-font-smoothing: antialiased;
        background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 7px);
    }

    header { background: rgba(18,20,18,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 18px 20px 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
    .logo-container { display: flex; align-items: center; gap: 10px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.2px; }
    .hist-btn { background: transparent; color: var(--text-dim); border: 1px solid var(--line); padding: 8px 14px; border-radius: 20px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; }
    .hist-btn:active { border-color: var(--accent); color: var(--accent); }

    /* Abas de Setores */
    .tabs-bar { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; background: rgba(18,20,18,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); position: sticky; top: 70px; z-index: 99; border-bottom: 1px solid var(--line); scrollbar-width: none; }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-btn { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--text-dim); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .tab-btn .tab-count { background: var(--surface-2); border-radius: 10px; padding: 1px 7px; font-size: 10.5px; font-family: 'Space Grotesk', sans-serif; }
    .tab-btn.active .tab-count { background: var(--accent); color: var(--bg); font-weight: 700; }

    .setor-banner { width: calc(100% - 40px); margin: 14px 20px 0 20px; border-radius: var(--radius); overflow: hidden; position: relative; border: 1px solid var(--line); background: var(--surface); }
    .setor-banner img { width: 100%; height: auto; display: block; filter: saturate(0.9) brightness(0.85); }
    .setor-banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(18,20,18,0.85) 100%); pointer-events: none; }

    .search-bar { padding: 14px 20px 6px 20px; background: var(--bg); position: sticky; top: 128px; z-index: 98; }
    .search-bar input { width: 100%; padding: 13px 16px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 15px; font-family: 'Inter', sans-serif; outline: none; transition: 0.2s; color: var(--text); }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--text-dim); }

    .product-list { padding: 4px 20px 0 20px; display: flex; flex-direction: column; }
    .list-group-header { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); padding: 16px 4px 6px 4px; }
    .edit-obs { width: 100%; min-height: 90px; padding: 14px; font-size: 15px; font-family: 'Inter', sans-serif; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); box-sizing: border-box; margin-bottom: 24px; outline: none; resize: vertical; display: none; }
    .edit-obs:focus { border-color: var(--accent); }
    .edit-obs::placeholder { color: var(--text-dim); }
    .product-item { padding: 15px 4px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.15s; border-radius: 10px; }
    .product-item:active { background: var(--surface); }

    .product-item.selected { position: relative; background: var(--accent-soft); border-radius: 10px; padding-left: 12px; border-bottom-color: transparent; }
    .product-item.selected::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background-color: var(--accent); border-radius: 4px;}

    .product-icon { font-size: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: 42px; height: 42px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
    .product-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .product-name { font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 600; line-height: 1.3; color: var(--text); letter-spacing: 0.1px; }
    .product-qty { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--accent); font-size: 12px; margin-top: 0; display: none; letter-spacing: 0.3px; line-height: 1.5; }
    .product-qty-obs { font-family: 'Inter', sans-serif; font-weight: 500; color: var(--text-dim); font-size: 11.5px; letter-spacing: 0; }

    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(18,20,18,0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 20px calc(14px + env(safe-area-inset-bottom)) 20px; border-top: 1px solid var(--line); text-align: center; z-index: 100;}
    .bottom-bar button { background: var(--accent); color: #10120F; border: none; padding: 16px; width: 100%; font-size: 15px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; text-transform: uppercase; letter-spacing: 1px; border-radius: 12px; cursor: pointer; }

    .screen { display: none; padding-bottom: 100px; }
    .screen.active { display: block; animation: fadeIn 0.15s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .screen-header { padding: 18px 20px; display: flex; align-items: center; gap: 14px; background: rgba(18,20,18,0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100;}
    .back-btn { background: none; border: none; font-size: 24px; color: var(--text); cursor: pointer; padding: 0 8px 0 0; font-weight: 300;}
    .screen-header h2 { margin:0; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.2px;}

    .edit-container { padding: 26px 20px; text-align: center; max-width: 480px; margin: 0 auto; }
    .edit-titulo-destaque { margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .edit-titulo-destaque span:first-child { font-size: 44px; background: var(--surface); padding: 18px; border-radius: 16px; border: 1px solid var(--line); }
    .edit-titulo-destaque span:last-child { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; color: var(--text); line-height: 1.3; margin-top: 6px;}

    .edit-input { width: 100%; padding: 12px 0; font-size: 46px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; text-align: center; border: none; border-bottom: 2px solid var(--accent); background: transparent; color: var(--text); box-sizing: border-box; margin-bottom: 30px; outline: none;}
    .edit-input::placeholder { color: var(--line); }

    .units { display: flex; gap: 8px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
    .unit-btn { padding: 10px 18px; border: 1px solid var(--line); background: var(--surface); color: var(--text-dim); border-radius: 20px; font-weight: 700; font-size: 12.5px; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer; transition: 0.2s; }
    .unit-btn.active { background: var(--accent); color: #10120F; border-color: var(--accent); }

    .edit-actions { display: flex; gap: 12px; }
    .btn-cancel { background: transparent; color: var(--text-dim); border: 1px solid var(--line); flex: 1; padding: 16px; border-radius: 12px; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
    .btn-confirm { background: var(--accent); color: #10120F; flex: 2; padding: 16px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }

    .summary-list, .history-list { padding: 8px 20px; }
    .summary-item { display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px;}
    .summary-item-icon { font-size: 18px; margin-right: 14px; background: var(--surface); padding: 9px; border-radius: 10px; border: 1px solid var(--line); }
    .summary-item-info { flex: 1; display: flex; justify-content: space-between; align-items: center; font-family: 'Inter', sans-serif; }
    .summary-item-info span { font-weight: 500; color: var(--text); }
    .summary-item-info strong { font-weight: 700; color: var(--accent); font-size: 16px; font-family: 'Space Grotesk', sans-serif;}

    .summary-footer { padding: 24px 20px 40px 20px; text-align: center; background: transparent; display: flex; flex-direction: column; gap: 12px; }
    .btn-whatsapp-link { display: block; box-sizing: border-box; text-decoration: none; background: #25D366; color: white; border: none; padding: 16px; width: 100%; font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px; border-radius: 12px; cursor: pointer; }
    .btn-copiar { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 16px; width: 100%; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px; border-radius: 12px; cursor: pointer; }
    .btn-email-link { display: block; box-sizing: border-box; text-decoration: none; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); padding: 16px; width: 100%; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px; border-radius: 12px; cursor: pointer; text-align: center; }

    .history-card-actions { display: flex; gap: 8px; margin-top: 14px; }
    .history-share-btn { flex: 1; text-decoration: none; text-align: center; background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--line); padding: 10px 6px; border-radius: 8px; font-size: 11px; font-weight: 700; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; }
    .history-share-btn.whats { color: #25D366; border-color: rgba(37,211,102,0.35); }

    .prio-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .prio-dot.prio-vermelho { background: #E85D5D; }
    .prio-dot.prio-amarelo { background: #F2C94C; }
    .prio-dot.prio-verde { background: #4CAF50; }

    .prio-icon-vermelho { background: rgba(232,93,93,0.15) !important; }
    .prio-icon-amarelo { background: rgba(242,201,76,0.15) !important; }
    .prio-icon-verde { background: rgba(76,175,80,0.15) !important; }

    .prio-btn-vermelho.active { background: #E85D5D; color: #10120F; border-color: #E85D5D; }
    .prio-btn-amarelo.active { background: #F2C94C; color: #10120F; border-color: #F2C94C; }
    .prio-btn-verde.active { background: #4CAF50; color: #10120F; border-color: #4CAF50; }

    .problema-item { position: relative; }
    .problema-del-btn { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 0 4px; flex-shrink: 0; }
    .problema-sanar-btn { background: rgba(76,175,80,0.12); border: 1px solid rgba(76,175,80,0.4); color: #4CAF50; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; flex-shrink: 0; }

    .history-card { background: var(--surface); padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 16px; }
    .history-date { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--text); margin-bottom: 4px; font-size: 15px; }
    .history-setor { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .history-item { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-dim); padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between;}
    .history-item:last-child { border-bottom: none; }
    .history-item strong { color: var(--text); }

    .folder-item .folder-chevron { margin-left: auto; color: var(--text-dim); font-size: 20px; flex-shrink: 0; }
    .folder-item .product-qty { display: block !important; }

    .grupo-nav-header { display: flex; align-items: center; gap: 10px; padding: 14px 20px 6px 20px; background: var(--bg); }
    .grupo-nav-header .back-btn-inline { background: var(--surface); border: 1px solid var(--line); color: var(--text); font-size: 18px; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; flex-shrink: 0; }
    .grupo-nav-header span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--text); }
</style>
</head>
<body>

<div id="main-screen" class="screen active">
    <header>
        <div class="logo-container">
            <svg width="35" height="35" viewBox="0 0 100 100">
                <g fill="var(--vinho-logo)">
                    <polygon points="50,42 55,50 50,58 45,50" />

                       <polygon points="50,28 56,38 44,38" />

                       <polygon points="50,15 62,32 38,32" transform="rotate(135 50 50)" />
                       <polygon points="50,15 62,32 38,32" transform="rotate(180 50 50)" />

                       <polygon points="50,0 58,12 42,12" transform="rotate(120 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(150 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(180 50 50)" />
                       <polygon points="50,0 58,12 42,12" transform="rotate(210 50 50)" />

            A Bela Sintra
        </div>
        <button class="hist-btn" onclick="abrirHistorico()">Histórico</button>

    <div class="tabs-bar" id="tabsBar"></div>

    <div class="grupo-nav-header" id="grupoNavHeader" style="display:none;">

<div id="edit-screen" class="screen">

        <button class="back-btn" onclick="fecharEdicao(false)">←</button>

    </div>

            <span id="editIconeDestaque"></span>

        <div class="units" id="maturacaoContainer"></div>

</div>

<div id="summary-screen" class="screen">

    </div>
    <div class="summary-list" id="summaryList"></div>
    
    <div class="summary-footer" id="summaryFooterContainer">
        <a id="btnWhatsAppLink" class="btn-whatsapp-link" href="#" target="_blank">Enviar via WhatsApp</a>
        <a id="btnEmailLink" class="btn-email-link" href="#">Enviar por E-mail</a>
        <button class="btn-copiar" onclick="copiarPedido()">Copiar Texto</button>
    </div>
</div>

<div id="manutencao-area-screen" class="screen">
    <div class="screen-header">
        <button class="back-btn" onclick="trocarTela('main-screen')">←</button>
        <h2 id="manutencaoAreaTitulo">Área</h2>
    </div>
    <div class="product-list" id="manutencaoProblemasList"></div>
    <div class="bottom-bar">
        <button onclick="abrirNovoProblema()">+ Adicionar problema</button>
    </div>
</div>

<div id="manutencao-edit-screen" class="screen">
    <div class="screen-header">
        <button class="back-btn" onclick="trocarTela('manutencao-area-screen')">←</button>
        <h2>Novo problema</h2>
    </div>
    <div class="edit-container">
        <div class="edit-titulo-destaque">
            <span id="manutencaoEditIcone"></span>
            <span id="manutencaoEditAreaNome"></span>

        <div class="units" id="prioridadeContainer"></div>
        <div class="edit-actions">
            <button class="btn-cancel" onclick="trocarTela('manutencao-area-screen')">Cancelar</button>

</div>

<div id="manutencao-summary-screen" class="screen">
    <div class="screen-header">
        <button class="back-btn" onclick="trocarTela('main-screen')">←</button>

    <div class="summary-footer" id="manutencaoSummaryFooter">

        <a id="manutencaoBtnEmail" class="btn-email-link" href="#">Enviar por E-mail</a>
        <button class="btn-copiar" onclick="copiarResumoManutencao()">Copiar Texto</button>
    </div>
</div>

<div id="history-screen" class="screen">
    <div class="screen-header">
        <button class="back-btn" onclick="trocarTela('main-screen')">←</button>
        <h2>Histórico</h2>
    </div>
    <div class="history-list" id="historyList"></div>
</div>


<script>
// ============================================================
// SUPABASE — banco compartilhado entre todos os aparelhos
// ============================================================
var SUPABASE_URL = "https://kfgcqshhltemsochafid.supabase.co";
var SUPABASE_KEY = "sb_publishable_-t8ynneFzBs_Xw3oEWenzA_APQqzOa-";
var supabaseOnline = true; // vira false se alguma chamada falhar, pra avisar o usuário

function supabaseHeaders(extra) {
    var h = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
    };
    if (extra) { for (var k in extra) { h[k] = extra[k]; } }
    return h;
}

function supabaseGet(tabela, query, callback) {
    var url = SUPABASE_URL + "/rest/v1/" + tabela + (query ? ("?" + query) : "");
    fetch(url, { headers: supabaseHeaders() })
        .then(function(r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
        .then(function(data) { supabaseOnline = true; callback(null, data); })
        .catch(function(err) { supabaseOnline = false; callback(err, null); });
}

function supabasePost(tabela, registro, callback) {
    fetch(SUPABASE_URL + "/rest/v1/" + tabela, {
        method: "POST",
        headers: supabaseHeaders({ "Prefer": "return=representation" }),
        body: JSON.stringify(registro)
    }).then(function(r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
      .then(function(data) { supabaseOnline = true; if (callback) callback(null, data); })
      .catch(function(err) { supabaseOnline = false; if (callback) callback(err, null); });
}

function supabaseDelete(tabela, filtroQuery, callback) {
    fetch(SUPABASE_URL + "/rest/v1/" + tabela + "?" + filtroQuery, {
        method: "DELETE",
        headers: supabaseHeaders()
    }).then(function(r) { if (!r.ok) throw new Error("status " + r.status); supabaseOnline = true; if (callback) callback(null); })
      .catch(function(err) { supabaseOnline = false; if (callback) callback(err); });
}

function gerarIdUnico() {
    return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
}

// ---- Histórico: cache local (usado pra renderizar) + Supabase (fonte compartilhada) ----
var historicoCache = [];

function lerHistoricoSeguro() {
    try {
        var dados = localStorage.getItem('pedidosHistoricoABS');
        if (dados) return JSON.parse(dados);
        return [];
    } catch (erro) { return []; }
}

function salvarHistoricoSeguro(historicoArray) {
    try { localStorage.setItem('pedidosHistoricoABS', JSON.stringify(historicoArray)); } catch (erro) { }
}

function registrarNoHistoricoCompartilhado(entry) {
    // Salva local (funciona offline) e envia pro Supabase (aparece nos outros celulares)
    var historicoLocal = lerHistoricoSeguro();
    historicoLocal.unshift(entry);
    salvarHistoricoSeguro(historicoLocal);

    supabasePost('historico', {
        data_texto: entry.data,
        setor: entry.setor,
        tipo: entry.tipo,
        itens: entry.itens
    }, function(err) {
        if (err) { console.warn('Não foi possível sincronizar com o Supabase (salvo localmente):', err); }
    });
}

function getSetorAtivo() {
    for (var i = 0; i < setores.length; i++) { if (setores[i].id === setorAtivoId) return setores[i]; }
    return setores[0];
}

function getSetorPorId(setorId) {
    for (var i = 0; i < setores.length; i++) { if (setores[i].id === setorId) return setores[i]; }
    return null;
}

function itemEstaCompleto(setorObj, registro) {
    if (!registro) return false;
    if (setorObj && setorObj.tipo === 'checklist') return !!registro.confirmado;
    return registro.qtd > 0;
}

function contarItensSetor(setorId) {
    if (setorId === 'manutencao') { return problemasAtuais.length; }
    var setorObj = getSetorPorId(setorId);
    var pedido = pedidos[setorId];
    var n = 0;
    for (var k in pedido) { if (itemEstaCompleto(setorObj, pedido[k])) n++; }
    return n;
}

function montarAbas() {
    var barra = document.getElementById('tabsBar');
    barra.innerHTML = "";
    for (var i = 0; i < setores.length; i++) {
        var setor = setores[i];
        var btn = document.createElement('button');
        btn.className = 'tab-btn' + (setor.id === setorAtivoId ? ' active' : '');
        btn.onclick = (function(id) { return function() { trocarSetor(id); }; })(setor.id);

        var span = document.createElement('span');
        span.innerText = setor.icone + ' ' + setor.nome;
        btn.appendChild(span);

        var n = contarItensSetor(setor.id);
        if (n > 0) {
            var count = document.createElement('span');
            count.className = 'tab-count';
            count.innerText = n;
            btn.appendChild(count);
        }
        barra.appendChild(btn);
    }
}

function trocarSetor(setorId) {
    setorAtivoId = setorId;
    grupoNavAtivo = null;
    document.getElementById('searchInput').value = "";
    montarAbas();
    montarListaInicial();
    atualizarVisuaisDaLista();

    if (setorId === 'manutencao') { sincronizarProblemasSupabase(); }
}

function sincronizarProblemasSupabase() {
    supabaseGet('manutencao_problemas', 'select=*&order=criado_em.asc', function(err, dados) {
        if (err || !dados) { return; } // mantém o que já está localmente se der erro
        var listaConvertida = [];
        for (var i = 0; i < dados.length; i++) {
            listaConvertida.push({
                id: dados[i].id,
                areaId: dados[i].area_id,
                areaNome: dados[i].area_nome,
                areaIcone: dados[i].area_icone,
                descricao: dados[i].descricao,
                prioridade: dados[i].prioridade
            });
        }
        problemasAtuais = listaConvertida;
        salvarProblemasManutencaoSeguro(problemasAtuais);

        // Se a tela de manutenção ou de uma área estiver aberta, atualiza a visualização
        if (setorAtivoId === 'manutencao') {
            montarListaManutencao();
            atualizarVisuaisDaLista();
        }
        if (areaManutencaoAtiva) { montarListaProblemasArea(); }
    });
}

function atualizarBottomBarLabel() {
    var setor = getSetorAtivo();
    var label = document.getElementById('bottomBarLabel');
    var barra = document.getElementById('mainBottomBar');
    if (!label) return;

    if (setor.navegacaoPorGrupo && grupoNavAtivo === null) {
        if (barra) { barra.style.display = 'none'; }
        return;
    }
    if (barra) { barra.style.display = 'block'; }

    if (setor.tipo === 'checklist') { label.innerText = 'Ver Checklist'; }
    else if (setor.tipo === 'manutencao') { label.innerText = 'Ver Resumo'; }
    else if (setor.navegacaoPorGrupo && grupoNavAtivo) { label.innerText = 'Enviar Pedido'; }
    else { label.innerText = 'Ver Pedido'; }
}

function aplicarAccentSetor() {
    var setor = getSetorAtivo();
    if (setor.accent) {
        document.documentElement.style.setProperty('--accent', setor.accent);
        var r = parseInt(setor.accent.substr(1,2), 16);
        var g = parseInt(setor.accent.substr(3,2), 16);
        var b = parseInt(setor.accent.substr(5,2), 16);
        document.documentElement.style.setProperty('--accent-soft', 'rgba(' + r + ',' + g + ',' + b + ',0.14)');
    }
}

        var g = setor.produtos[i].grupo;
        if (g && !vistos[g]) {
            vistos[g] = true;
            lista.push({ nome: g, icone: setor.produtos[i].icone });
        }
    }
    return lista;
}

            qtdP.className = 'product-qty';

        if (setor.navegacaoPorGrupo && p.grupo !== grupoNavAtivo) { continue; }

        if (!setor.navegacaoPorGrupo && p.grupo && p.grupo !== grupoAtualNome) {
            grupoAtualNome = p.grupo;

            header.className = 'list-group-header';

        }

        item.id = 'prod-item-' + i;
        
        item.onclick = (function(nomeProd, iconeProd) {

        })(p.nome, p.icone);

function atualizarVisuaisDaLista() {
    var setor = getSetorAtivo();

    if (setor.tipo === 'manutencao') {
        document.getElementById('cartCount').innerText = problemasAtuais.length;
        montarAbas();
        return;
    }

    var pedidoAtual = pedidos[setor.id];
    var filtro = document.getElementById('searchInput').value.toLowerCase();
    var contador = 0;
    var visivelPorIndice = {};

    // ---- Modo pasta (lista de fornecedores): atualiza só as contagens de cada pasta ----
    if (setor.navegacaoPorGrupo && grupoNavAtivo === null) {
        var grupos = gruposUnicosDoSetor(setor);
        var contagemPorGrupo = {};
        for (var gi = 0; gi < grupos.length; gi++) { contagemPorGrupo[grupos[gi].nome] = 0; }

        for (var k = 0; k < setor.produtos.length; k++) {
            var pk = setor.produtos[k];
            var registroK = pedidoAtual[pk.nome];
            if (itemEstaCompleto(setor, registroK)) {
                contador++;
                if (pk.grupo) { contagemPorGrupo[pk.grupo] = (contagemPorGrupo[pk.grupo] || 0) + 1; }
            }
        }

        for (var gj = 0; gj < grupos.length; gj++) {
            var badge = document.getElementById('folder-qtd-' + gj);
            var n = contagemPorGrupo[grupos[gj].nome] || 0;
            if (badge) {
                if (n > 0) {
                    badge.innerText = n + (n === 1 ? ' item lançado' : ' itens lançados');
                    badge.style.display = 'block';
                } else {
                    badge.innerText = '';
                    badge.style.display = 'none';
                }
            }
        }

        document.getElementById('cartCount').innerText = contador;
        montarAbas();
        return;
    }
    
    for (var i = 0; i < setor.produtos.length; i++) {
        var p = setor.produtos[i];
        var item = document.getElementById('prod-item-' + i);
        var divQtd = document.getElementById('prod-qtd-' + i);

        var registro = pedidoAtual[p.nome];
        var estaSelecionado = itemEstaCompleto(setor, registro);

        // Item pode não estar renderizado na tela atual (ex: outra pasta de fornecedor) — conta pro total mesmo assim
        if (!item || !divQtd) {
            if (estaSelecionado) { contador++; }
            continue;
        }

        var visivel = p.nome.toLowerCase().indexOf(filtro) !== -1;
        
        if (visivel) {
            item.style.display = "flex";
        } else {
            item.style.display = "none";
        }
        visivelPorIndice[i] = visivel;
        
        if (estaSelecionado) {
            item.className = 'product-item selected';
            if (setor.tipo === 'checklist') {
                divQtd.innerHTML = '✓ Pedido feito' + (registro.obs ? '<br><span class="product-qty-obs">' + registro.obs.replace(/</g,'&lt;') + '</span>' : '');
            } else {
                divQtd.innerText = registro.qtd + ' ' + registro.unidade + (registro.maturacao ? ' · ' + registro.maturacao : '');
            }
            divQtd.style.display = "block";
            contador++;
        } else {
            item.className = 'product-item';
            divQtd.style.display = "none";
        }
    }

    // Esconde cabeçalhos de grupo sem nenhum item visível na busca atual
    for (var g = 0; g < gruposAtuais.length; g++) {
        var grupo = gruposAtuais[g];
        var algumVisivel = false;
        for (var j = 0; j < grupo.indices.length; j++) {
            if (visivelPorIndice[grupo.indices[j]]) { algumVisivel = true; break; }
        }
        grupo.headerEl.style.display = algumVisivel ? "block" : "none";
    }

    document.getElementById('cartCount').innerText = contador;
    montarAbas();
}

function trocarTela(idTela) {
    if (idTela !== 'main-screen' && document.getElementById('main-screen').classList.contains('active')) {
        scrollSalvo = window.pageYOffset || document.documentElement.scrollTop;
    }

    var telas = document.querySelectorAll('.screen');
    for(var i = 0; i < telas.length; i++) { telas[i].classList.remove('active'); }
    
    var telaNova = document.getElementById(idTela);
    telaNova.classList.add('active');
    
    if (idTela === 'main-screen') {
        window.scrollTo(0, scrollSalvo);
        document.documentElement.scrollTop = scrollSalvo;
        document.body.scrollTop = scrollSalvo;
    } else {
        window.scrollTo(0, 0); 
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        
        var cabecalho = telaNova.querySelector('.screen-header');
        if(cabecalho) {
            setTimeout(function() {
                cabecalho.scrollIntoView({ behavior: 'instant', block: 'start' });
            }, 10);
        }
    }
}

function abrirEdicao(nomeProduto, iconeProduto) {
    var setor = getSetorAtivo();
    var pedidoAtual = pedidos[setor.id];
    produtoSendoEditado = nomeProduto;
    document.getElementById('editProductName').innerText = nomeProduto;
    document.getElementById('editIconeDestaque').innerText = iconeProduto;

    var input = document.getElementById('editQty');
    var unitsContainer = document.getElementById('unitsContainer');
    var maturacaoContainer = document.getElementById('maturacaoContainer');
    var obsBox = document.getElementById('editObs');
    var registro = pedidoAtual[nomeProduto];

    if (setor.tipo === 'checklist') {
        input.style.display = "none";
        unitsContainer.style.display = "none";
        maturacaoContainer.style.display = "none";
        obsBox.style.display = "block";
        obsBox.value = (registro && registro.obs) ? registro.obs : "";
    } else {
        input.style.display = "block";
        unitsContainer.style.display = "flex";
        obsBox.style.display = "none";

        unitsContainer.innerHTML = "";
        for (var i = 0; i < setor.unidades.length; i++) {
            var u = setor.unidades[i];
            var btn = document.createElement('button');
            btn.className = 'unit-btn';
            btn.innerText = u;
            btn.onclick = (function(b, un) { return function() { selecionarUnidade(b, un); }; })(btn, u);
            unitsContainer.appendChild(btn);
        }

        if (setor.maturacao && setor.maturacao.length > 0) {
            maturacaoContainer.style.display = "flex";
            maturacaoContainer.innerHTML = "";

                var op = setor.maturacao[m];
                var btnM = document.createElement('button');
                btnM.className = 'unit-btn';
                btnM.innerText = op;
                btnM.onclick = (function(b, ma) { return function() { selecionarMaturacao(b, ma); }; })(btnM, op);
                maturacaoContainer.appendChild(btnM);
            }
        } else {
            maturacaoContainer.style.display = "none";
            maturacaoContainer.innerHTML = "";
        }

        if (registro && registro.qtd > 0) {
            input.value = registro.qtd;
            destacarUnidade(registro.unidade);
            destacarMaturacao(registro.maturacao || (setor.maturacao ? setor.maturacao[0] : ""));

            input.value = "";
            destacarUnidade(setor.unidades[0]);
            destacarMaturacao(setor.maturacao ? setor.maturacao[0] : "");
        }
    }
    
    trocarTela('edit-screen');
}

function confirmarQuantidade() {
    var setor = getSetorAtivo();

    if (setor.tipo === 'checklist') {
        var obs = document.getElementById('editObs').value;
        pedidos[setor.id][produtoSendoEditado] = { confirmado: true, obs: obs };
    } else {
        var inputVal = document.getElementById('editQty').value.replace(',', '.');
        var val = parseFloat(inputVal);
        
        if (val > 0) { 
            var registroNovo = { qtd: val, unidade: unidadeSelecionada };

            pedidos[setor.id][produtoSendoEditado] = registroNovo;

            pedidos[setor.id][produtoSendoEditado] = null; 
        }
    }
    
    atualizarVisuaisDaLista();
    trocarTela('main-screen');
}

// ---- Funções genéricas de compartilhamento (usadas no resumo atual e no histórico) ----
function linkWhatsApp(texto) {
    return "https://wa.me/?text=" + encodeURIComponent(texto);
}

function linkEmail(assunto, texto) {
    return "mailto:?subject=" + encodeURIComponent(assunto) + "&body=" + encodeURIComponent(texto);
}

function copiarTextoGenerico(texto, mensagemSucesso) {
    var areaTexto = document.createElement("textarea");
    areaTexto.value = texto;
    areaTexto.style.position = "fixed";
    areaTexto.style.top = "0";
    areaTexto.style.left = "0";
    document.body.appendChild(areaTexto);
    areaTexto.focus();
    areaTexto.select();

    var copiado = false;
    try { copiado = document.execCommand('copy'); } catch (err) { copiado = false; }
    document.body.removeChild(areaTexto);

    if (copiado) {
        alert(mensagemSucesso || "✅ Texto copiado!");
    } else {
        alert("Erro. Seu navegador bloqueou a cópia automática.");
    }
    return copiado;
}

function copiarItemHistorico(indice) {
    var entry = historicoCache[indice];
    if (!entry) return;
    copiarTextoGenerico(textoDoHistorico(entry), "✅ Pedido copiado!");
}

function textoDoHistorico(entry) {
    var titulo;
    if (entry.tipo === 'checklist') { titulo = "Fornecedores confirmados"; }
    else if (entry.tipo === 'manutencao') { titulo = "Resumo de Manutenção"; }
    else { titulo = "Pedido " + entry.setor; }
    return "*" + titulo + " - " + entry.data + "*\n\n" + entry.itens.join("\n");;
}

function verResumo() {

        linkMail.href = linkEmail(tituloEmail, dados.texto);

    trocarTela('summary-screen');
}

function gerarTextoPedido() {
    var setor = getSetorAtivo();
    var pedidoAtual = pedidos[setor.id];
    var dataLocal = new Date();
    var dataStr = dataLocal.toLocaleDateString('pt-BR');
    var horaStr = dataLocal.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

    var grupoFiltro = (setor.navegacaoPorGrupo && grupoNavAtivo) ? grupoNavAtivo : null;
    var mapaGrupoPorNome = {};
    if (grupoFiltro) {
        for (var m = 0; m < setor.produtos.length; m++) { mapaGrupoPorNome[setor.produtos[m].nome] = setor.produtos[m].grupo; }
    }

    var titulo = grupoFiltro ? ("Pedido " + grupoFiltro) : (setor.tipo === 'checklist' ? "Fornecedores confirmados" : ("Pedido " + setor.nome));
    var texto = "*" + titulo + " - " + dataStr + " às " + horaStr + "*\n\n";
    var itensParaHistorico = [];
    var temItens = false;
    
    for (var k in pedidoAtual) {
        if (grupoFiltro && mapaGrupoPorNome[k] !== grupoFiltro) { continue; }
        var registro = pedidoAtual[k];
        if (itemEstaCompleto(setor, registro)) {
            temItens = true;
            var linha;
            if (setor.tipo === 'checklist') {
                linha = "- " + k + (registro.obs ? "\n  " + registro.obs : "");
            } else {
                linha = "- " + registro.qtd + " " + registro.unidade + (registro.maturacao ? " (" + registro.maturacao + ")" : "") + " - " + k;
            }
            texto += linha + "\n";
            itensParaHistorico.push(linha);
        }
    }
    
    return { texto: texto, itens: itensParaHistorico, temItens: temItens, dataStr: dataStr, horaStr: horaStr, setorNome: setor.nome, setorId: setor.id, tipo: setor.tipo, grupoFiltro: grupoFiltro };
}

function salvarEVoltarTela(dados) {
    registrarNoHistoricoCompartilhado({
        data: dados.dataStr + " às " + dados.horaStr,
        setor: dados.grupoFiltro ? (dados.setorNome + ' · ' + dados.grupoFiltro) : dados.setorNome,
        tipo: dados.tipo,
        itens: dados.itens
    });
    
    setTimeout(function() {
        if (dados.grupoFiltro) {
            var setorObj = getSetorPorId(dados.setorId);
            var mapaGrupoPorNome = {};
            for (var m = 0; m < setorObj.produtos.length; m++) { mapaGrupoPorNome[setorObj.produtos[m].nome] = setorObj.produtos[m].grupo; }
            var pedidoDoSetor = pedidos[dados.setorId];
            for (var k in pedidoDoSetor) {
                if (mapaGrupoPorNome[k] === dados.grupoFiltro) { delete pedidoDoSetor[k]; }
            }
        } else {
            pedidos[dados.setorId] = {};
        }
        document.getElementById('searchInput').value = "";
        atualizarVisuaisDaLista();
        trocarTela('main-screen');
    }, 500);
}

// ---- MANUTENÇÃO: renderização e lógica ----

function areaPorId(id) {
    for (var i = 0; i < areasManutencao.length; i++) { if (areasManutencao[i].id === id) return areasManutencao[i]; }
    return null;
}

function contarProblemasArea(areaId) {
    var n = 0;
    for (var i = 0; i < problemasAtuais.length; i++) { if (problemasAtuais[i].areaId === areaId) n++; }
    return n;
}

function prioridadesPresentesArea(areaId) {
    var presentes = {};
    for (var i = 0; i < problemasAtuais.length; i++) {
        if (problemasAtuais[i].areaId === areaId) { presentes[problemasAtuais[i].prioridade] = true; }
    }
    return presentes;
}

function montarListaManutencao() {
    var lista = document.getElementById('productList');
    lista.innerHTML = "";

    for (var i = 0; i < areasManutencao.length; i++) {
        var area = areasManutencao[i];

        var item = document.createElement('div');
        item.className = 'product-item';
        item.onclick = (function(areaId) { return function() { abrirAreaManutencao(areaId); }; })(area.id);

        var icone = document.createElement('div');
        icone.className = 'product-icon';
        icone.innerText = area.icone;

        var info = document.createElement('div');
        info.className = 'product-info';

        var nome = document.createElement('div');
        nome.className = 'product-name';
        nome.innerText = area.nome;
        info.appendChild(nome);

        var n = contarProblemasArea(area.id);
        var statusDiv = document.createElement('div');
        statusDiv.className = 'product-qty';
        if (n > 0) {
            var presentes = prioridadesPresentesArea(area.id);
            var dots = '';
            for (var o = 0; o < ordemPrioridades.length; o++) {
                var chave = ordemPrioridades[o];
                if (presentes[chave]) { dots += '<span class="prio-dot prio-' + chave + '"></span>'; }
            }
            statusDiv.innerHTML = dots + n + (n === 1 ? ' problema' : ' problemas');
            statusDiv.style.display = "block";
            item.className = 'product-item selected';
        }
        info.appendChild(statusDiv);

        item.appendChild(icone);
        item.appendChild(info);
        lista.appendChild(item);
    }
}

function abrirAreaManutencao(areaId) {
    areaManutencaoAtiva = areaId;
    var area = areaPorId(areaId);
    document.getElementById('manutencaoAreaTitulo').innerText = area.nome;
    montarListaProblemasArea();
    trocarTela('manutencao-area-screen');
    sincronizarProblemasSupabase();
}

function montarListaProblemasArea() {
    var lista = document.getElementById('manutencaoProblemasList');
    lista.innerHTML = "";
    var problemas = [];
    for (var i = 0; i < problemasAtuais.length; i++) {
        if (problemasAtuais[i].areaId === areaManutencaoAtiva) { problemas.push(problemasAtuais[i]); }
    }

    if (problemas.length === 0) {
        lista.innerHTML = "<p style='text-align:center; color:var(--text-dim); margin-top: 30px; font-family: Inter, sans-serif; font-size: 14px;'>Nenhum problema registrado nesta área ainda.</p>";
        return;
    }

    for (var j = 0; j < problemas.length; j++) {
        var p = problemas[j];
        var item = document.createElement('div');
        item.className = 'product-item problema-item selected';

        var dot = document.createElement('div');
        dot.className = 'product-icon prio-icon-' + p.prioridade;
        dot.innerText = prioridadesInfo[p.prioridade].emoji;

        var info = document.createElement('div');
        info.className = 'product-info';

        var desc = document.createElement('div');
        desc.className = 'product-name';
        desc.innerText = p.descricao;
        info.appendChild(desc);

        var prioLabel = document.createElement('div');
        prioLabel.className = 'product-qty';
        prioLabel.style.display = 'block';
        prioLabel.style.color = prioridadesInfo[p.prioridade].cor;
        prioLabel.innerText = 'Prioridade ' + prioridadesInfo[p.prioridade].label;
        info.appendChild(prioLabel);

        item.appendChild(dot);
        item.appendChild(info);

        var acoesProblema = document.createElement('div');
        acoesProblema.style.display = 'flex';
        acoesProblema.style.gap = '6px';
        acoesProblema.style.flexShrink = '0';

        var sanarBtn = document.createElement('button');
        sanarBtn.innerText = '✓ Sanado';
        sanarBtn.className = 'problema-sanar-btn';
        sanarBtn.onclick = (function(id) { return function(e) { if (e) e.stopPropagation(); marcarProblemaSanado(id); }; })(p.id);
        acoesProblema.appendChild(sanarBtn);

        var delBtn = document.createElement('button');
        delBtn.innerText = '✕';
        delBtn.className = 'problema-del-btn';
        delBtn.onclick = (function(id) { return function(e) { if (e) e.stopPropagation(); removerProblema(id); }; })(p.id);
        acoesProblema.appendChild(delBtn);

        item.appendChild(acoesProblema);

        lista.appendChild(item);
    }
}

function removerProblema(id) {
    var novaLista = [];
    for (var i = 0; i < problemasAtuais.length; i++) { if (problemasAtuais[i].id !== id) { novaLista.push(problemasAtuais[i]); } }
    problemasAtuais = novaLista;
    salvarProblemasManutencaoSeguro(problemasAtuais);
    supabaseDelete('manutencao_problemas', 'id=eq.' + encodeURIComponent(id), function(err) {
        if (err) { console.warn('Não foi possível remover no Supabase (removido localmente):', err); }
    });
    montarListaProblemasArea();
    atualizarVisuaisDaLista();
}

function marcarProblemaSanado(id) {
    var idx = -1;
    for (var i = 0; i < problemasAtuais.length; i++) { if (problemasAtuais[i].id === id) { idx = i; break; } }
    if (idx === -1) return;

    var problema = problemasAtuais[idx];
    problemasAtuais.splice(idx, 1);
    salvarProblemasManutencaoSeguro(problemasAtuais);
    supabaseDelete('manutencao_problemas', 'id=eq.' + encodeURIComponent(id), function(err) {
        if (err) { console.warn('Não foi possível remover no Supabase (removido localmente):', err); }
    });

    var dataLocal = new Date();
    var dataStr = dataLocal.toLocaleDateString('pt-BR');
    var horaStr = dataLocal.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
    var linha = "✅ SANADO — " + prioridadesInfo[problema.prioridade].emoji + " " + problema.areaNome + ": " + problema.descricao;

    registrarNoHistoricoCompartilhado({
        data: dataStr + " às " + horaStr,
        setor: "Manutenção",
        tipo: "manutencao",
        itens: [linha]
    });

    montarListaProblemasArea();
    atualizarVisuaisDaLista();
}

function abrirNovoProblema() {
    var area = areaPorId(areaManutencaoAtiva);
    document.getElementById('manutencaoEditIcone').innerText = area.icone;
    document.getElementById('manutencaoEditAreaNome').innerText = area.nome;
    document.getElementById('manutencaoDescricao').value = "";

    var cont = document.getElementById('prioridadeContainer');
    cont.innerHTML = "";
    for (var i = 0; i < ordemPrioridades.length; i++) {
        var chave = ordemPrioridades[i];
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'unit-btn prio-btn-' + chave;
        btn.innerText = prioridadesInfo[chave].label;
        btn.onclick = (function(b, ch) { return function() { selecionarPrioridade(b, ch); }; })(btn, chave);
        cont.appendChild(btn);
    }
    selecionarPrioridade(cont.children[0], 'vermelho');

    trocarTela('manutencao-edit-screen');
}

function selecionarPrioridade(btn, chave) {
    prioridadeSelecionada = chave;
    var botoes = document.querySelectorAll('#prioridadeContainer .unit-btn');
    for (var i = 0; i < botoes.length; i++) { botoes[i].classList.remove('active'); }
    if (btn) { btn.classList.add('active'); }
}

function confirmarProblema() {
    var desc = document.getElementById('manutencaoDescricao').value.trim();
    if (!desc) { alert("Descreva o problema antes de salvar."); return; }
    var area = areaPorId(areaManutencaoAtiva);
    var novoProblema = {
        id: gerarIdUnico(),
        areaId: area.id,
        areaNome: area.nome,
        areaIcone: area.icone,
        descricao: desc,
        prioridade: prioridadeSelecionada
    };
    problemasAtuais.push(novoProblema);
    salvarProblemasManutencaoSeguro(problemasAtuais);

    supabasePost('manutencao_problemas', {
        id: novoProblema.id,
        area_id: novoProblema.areaId,
        area_nome: novoProblema.areaNome,
        area_icone: novoProblema.areaIcone,
        descricao: novoProblema.descricao,
        prioridade: novoProblema.prioridade
    }, function(err) {
        if (err) { console.warn('Não foi possível sincronizar novo problema com o Supabase (salvo localmente):', err); }
    });

    montarListaProblemasArea();
    atualizarVisuaisDaLista();
    trocarTela('manutencao-area-screen');
}

function dadosResumoManutencao() {
    var dataLocal = new Date();
    var dataStr = dataLocal.toLocaleDateString('pt-BR');
    var horaStr = dataLocal.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
    var texto = "*Resumo de Manutenção - " + dataStr + " às " + horaStr + "*\n\n";
    var itensParaHistorico = [];

    for (var o = 0; o < ordemPrioridades.length; o++) {
        var chave = ordemPrioridades[o];
        var doGrupo = [];
        for (var i = 0; i < problemasAtuais.length; i++) { if (problemasAtuais[i].prioridade === chave) { doGrupo.push(problemasAtuais[i]); } }
        if (doGrupo.length === 0) continue;

        texto += "— " + prioridadesInfo[chave].emoji + " " + prioridadesInfo[chave].label.toUpperCase() + " —\n";
        for (var j = 0; j < doGrupo.length; j++) {
            var linha = "- " + prioridadesInfo[chave].emoji + " " + doGrupo[j].areaNome + ": " + doGrupo[j].descricao;
            texto += linha + "\n";
            itensParaHistorico.push(linha);
        }
        texto += "\n";
    }

    return { texto: texto, itens: itensParaHistorico, temItens: problemasAtuais.length > 0, dataStr: dataStr, horaStr: horaStr, setorNome: "Manutenção", setorId: "manutencao", tipo: "manutencao" };
}

function verResumoManutencao() {
    var lista = document.getElementById('manutencaoSummaryList');
    var footer = document.getElementById('manutencaoSummaryFooter');
    lista.innerHTML = "";

    if (problemasAtuais.length === 0) {
        lista.innerHTML = "<p style='text-align:center; color:#999; margin-top: 30px; font-family: Inter, sans-serif;'>Nenhum problema pendente no momento. Tudo sanado! 🎉</p>";
        footer.style.display = "none";
        trocarTela('manutencao-summary-screen');
        return;
    }

    footer.style.display = "flex";

    for (var o = 0; o < ordemPrioridades.length; o++) {
        var chave = ordemPrioridades[o];
        var doGrupo = [];
        for (var i = 0; i < problemasAtuais.length; i++) { if (problemasAtuais[i].prioridade === chave) { doGrupo.push(problemasAtuais[i]); } }
        if (doGrupo.length === 0) continue;

        var header = document.createElement('div');
        header.className = 'list-group-header';
        header.style.color = prioridadesInfo[chave].cor;
        header.innerText = prioridadesInfo[chave].emoji + ' ' + prioridadesInfo[chave].label + ' (' + doGrupo.length + ')';
        lista.appendChild(header);

        for (var j = 0; j < doGrupo.length; j++) {
            var p = doGrupo[j];
            var div = document.createElement('div');
            div.className = 'summary-item';

            var iconDiv = document.createElement('div');
            iconDiv.className = 'summary-item-icon';
            iconDiv.innerText = p.areaIcone;

            var infoDiv = document.createElement('div');
            infoDiv.className = 'summary-item-info';
            infoDiv.innerHTML = '<span>' + p.areaNome + '</span> <strong style="font-size:13px; font-family:Inter, sans-serif; font-weight:600; color:' + prioridadesInfo[chave].cor + ';">' + p.descricao + '</strong>';

            div.appendChild(iconDiv);
            div.appendChild(infoDiv);
            lista.appendChild(div);
        }
    }

    var dados = dadosResumoManutencao();
    document.getElementById('manutencaoBtnWhatsApp').href = linkWhatsApp(dados.texto);
    document.getElementById('manutencaoBtnEmail').href = linkEmail("Resumo de Manutenção - " + dados.dataStr, dados.texto);

    trocarTela('manutencao-summary-screen');
}

function registrarEnvioResumoManutencao(dados) {
    if (!dados.temItens) return;
    registrarNoHistoricoCompartilhado({
        data: dados.dataStr + " às " + dados.horaStr,
        setor: dados.setorNome + " (resumo enviado)",
        tipo: dados.tipo,
        itens: dados.itens
    });
    // Não limpa problemasAtuais: pendentes continuam até serem marcados como Sanado individualmente.
}

function copiarResumoManutencao() {
    var dados = dadosResumoManutencao();
    if (!dados.temItens) { alert("Nenhum problema pendente no momento."); return; }
    var copiado = copiarTextoGenerico(dados.texto, "✅ Resumo de manutenção copiado!");
    if (copiado) { registrarEnvioResumoManutencao(dados); }
}

function copiarPedido() {
    var dados = gerarTextoPedido();
    if (!dados.temItens) {
        alert("O pedido está vazio. Selecione itens antes de copiar.");
        return;
    }

    var copiado = copiarTextoGenerico(dados.texto, "✅ Pedido copiado! Abra o WhatsApp e cole para o fornecedor.");
    if (copiado) { salvarEVoltarTela(dados); }
}

function abrirHistorico() {
    trocarTela('history-screen');

    // Mostra o que já tem localmente na hora (rápido, sem esperar rede)
    renderizarListaHistorico(lerHistoricoSeguro());

    // Busca a versão mais atual no Supabase (o que os outros celulares registraram)
    supabaseGet('historico', 'select=*&order=criado_em.desc&limit=200', function(err, dados) {
        if (err || !dados) { return; } // fica com a versão local se der erro (ex: sem internet)
        var convertido = [];
        for (var i = 0; i < dados.length; i++) {
            convertido.push({
                data: dados[i].data_texto,
                setor: dados[i].setor,
                tipo: dados[i].tipo,
                itens: dados[i].itens
            });
        }
        salvarHistoricoSeguro(convertido);
        renderizarListaHistorico(convertido);
    });
}

function renderizarListaHistorico(historico) {
    historicoCache = historico;
    var lista = document.getElementById('historyList');
    lista.innerHTML = "";
    
    if (historico.length === 0) {
        lista.innerHTML = "<p style='text-align:center; color:#999; margin-top: 30px; font-family: Lato, sans-serif;'>Nenhum histórico encontrado.</p>";
    } else {
        for(var h = 0; h < historico.length; h++) {
            var pedidoHist = historico[h];
            var card = document.createElement('div');
            card.className = 'history-card';
            
            var data = document.createElement('div');
            data.className = 'history-date';
            data.innerText = pedidoHist.data;
            card.appendChild(data);

            if (pedidoHist.setor) {
                var setorTag = document.createElement('div');
                setorTag.className = 'history-setor';
                setorTag.innerText = pedidoHist.setor;
                card.appendChild(setorTag);
            }
            
            for(var i = 0; i < pedidoHist.itens.length; i++) {
                var item = document.createElement('div');
                item.className = 'history-item';

                if (pedidoHist.tipo === 'checklist' || pedidoHist.tipo === 'manutencao') {
                    var spanTexto = document.createElement('span');
                    var textoLimpo = pedidoHist.itens[i].replace(/^[-▪]\s*/, "");
                    var escapado = textoLimpo.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    spanTexto.innerHTML = escapado.replace(/\n\s*/g, '<br><span class="product-qty-obs">') + (textoLimpo.indexOf('\n') !== -1 ? '</span>' : '');
                    item.appendChild(spanTexto);
                } else {
                    var partes = pedidoHist.itens[i].replace(/^[-▪]\s*/, "").split(" - ");
                    var spanQtd = document.createElement('strong');
                    spanQtd.innerText = partes[0];
                    var spanNome = document.createElement('span');
                    spanNome.innerText = partes[1];
                    
                    item.appendChild(spanNome);
                    item.appendChild(spanQtd);
                }
                
                card.appendChild(item);
            }

            var acoes = document.createElement('div');
            acoes.className = 'history-card-actions';

            var titulo;
            if (pedidoHist.tipo === 'checklist') { titulo = "Fornecedores confirmados"; }
            else if (pedidoHist.tipo === 'manutencao') { titulo = "Resumo de Manutenção"; }
            else { titulo = "Pedido " + pedidoHist.setor; }
            var textoCompleto = textoDoHistorico(pedidoHist);

            var btnZapHist = document.createElement('a');
            btnZapHist.className = 'history-share-btn whats';
            btnZapHist.innerText = 'WhatsApp';
            btnZapHist.href = linkWhatsApp(textoCompleto);
            btnZapHist.target = '_blank';
            acoes.appendChild(btnZapHist);

            var btnMailHist = document.createElement('a');
            btnMailHist.className = 'history-share-btn';
            btnMailHist.innerText = 'E-mail';
            btnMailHist.href = linkEmail(titulo + " - " + pedidoHist.data, textoCompleto);
            acoes.appendChild(btnMailHist);

            var btnCopyHist = document.createElement('button');
            btnCopyHist.className = 'history-share-btn';
            btnCopyHist.innerText = 'Copiar';
            btnCopyHist.onclick = (function(idx) { return function() { copiarItemHistorico(idx); }; })(h);
            acoes.appendChild(btnCopyHist);

            card.appendChild(acoes);
            
            lista.appendChild(card);
        }
    }
}

document.addEventListener('DOMContentLoaded', iniciar);
if (document.readyState === "interactive" || document.readyState === "complete") { iniciar(); }
</script>
